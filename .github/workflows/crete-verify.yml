name: crete-verify

# The shared Endless bank's trusted runner. Every six hours, and by hand from the Actions tab, it talks to the bank
# endpoint on happystl.com (https://www.happystl.com/crete-bank/endless-bank.php, websites/www.cs/games/crete/
# endless-bank.php) over HTTPS only, never ssh or sftp, in two steps within one fixed budget of 47 minutes, each
# through the site's make target (websites/www.cs/Makefile), the same one a person runs on their own machine:
#
# 1. make crete-verify-levels (tools/verify-bank.ts) checks the levels waiting in quarantine: it makes each again from
#    its tuple with main's generator and posts a match or a mismatch; one trusted match admits a level. At most 25
#    levels, 12 minutes.
# 2. make crete-levels (tools/generate-bank.ts) spends the rest of the budget making new Endless levels on every core,
#    its time shared among the grades with room (Hard 50%, Medium 30%, Easy 20%), the scarcest first within each (the
#    plateau, large boards especially), and posts each straight into the served pool with its provenance tuple, never
#    past a grade's cap. Once every grade is full (none still filling has room or a part running) it turns each over:
#    up to 1.5% of a grade's cap per run, each new level replacing one served level the server picks, one out for each
#    one in.
#
# The token, CRETE_BANK_VERIFIER_TOKEN, is the bank-verifier field of the item "Crete Config" in the SIUE 1Password
# vault, the same one the deploy turns into the bank's hash (bank/verifier.json, written by tools/deploy-bank.sh). It
# is read through the production environment's OP_SERVICE_ACCOUNT_TOKEN secret, as the deploy reads its login, and
# the action masks it, so it is never printed. Without the item the run skips both steps and says so. A failed step
# only leaves the bank as it was.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crete-verify
  cancel-in-progress: false

jobs:
  verify-and-generate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Load the token (optional)
        continue-on-error: true
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CRETE_BANK_VERIFIER_TOKEN: op://khvwk3iogv3mhhjui4se7xqyni/Crete Config/bank-verifier

      - name: Look for the token
        id: token
        run: |
          echo "CRETE_START=$(date +%s)" >> "$GITHUB_ENV"
          if [ -n "${CRETE_BANK_VERIFIER_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Crete bank verifier token in 1Password (item \"Crete Config\", field bank-verifier); skipping verification and generation."
          fi

      - name: Check the levels waiting in the shared bank
        if: steps.token.outputs.present == 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: make -C websites/www.cs crete-verify-levels COUNT=25 MINUTES=12

      - name: Make new levels for the shared bank
        if: steps.token.outputs.present == 'true'
        continue-on-error: true
        timeout-minutes: 45
        run: |
          left=$(( 47 - ( $(date +%s) - CRETE_START ) / 60 ))
          if [ "$left" -lt 2 ]; then echo "generate-bank: no time left in this run"; exit 0; fi
          # The runner has no user systemd to cap the run; it is a throwaway VM, and each worker's heap is still capped.
          make -C websites/www.cs crete-levels MINUTES="$left" ROLLOVER=yes ALLOW_UNCAPPED=yes

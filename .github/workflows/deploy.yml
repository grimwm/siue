name: deploy

# Deploys www.cs to www.cs.siue.edu once ci.yml passes on a push to main,
# with the same `make deploy` a person runs. deploy.sh hashes what the site
# serves and compares it with the host's .deploy-hash stamp: nothing to do
# when they match, otherwise it uploads only the files that changed and
# deletes the ones the last deploy sent that are now gone (PRUNE=1). Run it
# by hand from the Actions tab to redeploy main; "force" sends every file.
#
# The deploy job runs in the `production` environment, which only admits
# runs from main. Its one GitHub secret is that environment's
#   OP_SERVICE_ACCOUNT_TOKEN - a 1Password service account, read-only on the
#     vault below.
# The login itself is the SIUE item in the SIUE 1Password vault, referenced
# by id so renaming either never breaks the deploy:
#   vault khvwk3iogv3mhhjui4se7xqyni, item ioa6izbxvctbalcb65y5fr3esu
# The studios' named people and caps are optional, in their own item so a
# missing one cannot stop the login loading:
#   item "SIUE music studio config" in the same vault, field studio-config,
#   JSON (see websites/www.cs/admin/README.md). deploy.sh validates it and
#   writes it to admin/config/studio.json on the host; without the item the
#   site runs on the defaults.
#     username - the SIUE address (wgrim@siue.edu); the host account is the
#                part before the @
#     password - its password, fed to sftp/scp through sshpass
#
# The bank job deploys Crete's shared Endless bank to happystl.com (DreamHost)
# alongside, through games/crete/tools/deploy-bank.sh: the bank's files into
# ~/happystl.com/crete-bank/ (https://www.happystl.com/crete-bank/endless-bank.php),
# its levels kept in ~/crete-bank-data/, outside the web root, which no deploy
# uploads to or deletes. It sends only the bank's files and deletes nothing.
# Same gate, same environment, same 1Password service account, two items:
#   item "Dreamhost Deploys" in the same vault, its private key (an ssh key
#     whose public half is in the account's authorized_keys with `restrict`)
#   item "Crete Config", field bank-verifier: the trusted runner's token
#     (crete-verify.yml reads the same item); deploy-bank.sh stages only its
#     sha256, as bank/verifier.json
# ssh only accepts the host keys in .github/ssh_known_hosts.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Send every file, even when the host is up to date"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    # Only a green ci run from a push to this repository's main; a fork's
    # pull request from a branch named main must never get here.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-www-cs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      # Runs finish out of order; deploying an older commit after a newer one
      # would roll the site back. Only main's current tip ships.
      - name: Check this is main's tip
        id: tip
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tip=$(git rev-parse HEAD)
          if [ -n "$RUN_SHA" ] && [ "$RUN_SHA" != "$tip" ]; then
            echo "ci passed for $RUN_SHA, but main is now $tip; its own run deploys it"
            echo "skip=1" >>"$GITHUB_OUTPUT"
          else
            echo "deploying $tip"
          fi

      # deploy.sh checks generated pages with PHP, Tankity's compiled modules
      # with Node, and hashes with python3.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        if: steps.tip.outputs.skip != '1'
        with:
          php-version: "8.4"
          coverage: none

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.tip.outputs.skip != '1'
        with:
          node-version: "24"

      - name: Install sshpass and the host keys
        if: steps.tip.outputs.skip != '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 700 ~/.ssh
          grep -v '^#' .github/ssh_known_hosts >~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf 'Host www.cs.siue.edu\n  StrictHostKeyChecking yes\n' >~/.ssh/config

      - name: Load the deploy login
        if: steps.tip.outputs.skip != '1'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SIUE_USER: op://khvwk3iogv3mhhjui4se7xqyni/ioa6izbxvctbalcb65y5fr3esu/username
          SIUE_PASSWORD: op://khvwk3iogv3mhhjui4se7xqyni/ioa6izbxvctbalcb65y5fr3esu/password

      - name: Load the studio config (optional)
        if: steps.tip.outputs.skip != '1'
        continue-on-error: true
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          STUDIO_CONFIG: op://khvwk3iogv3mhhjui4se7xqyni/SIUE music studio config/studio-config

      - name: Deploy
        if: steps.tip.outputs.skip != '1'
        env:
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          set -euo pipefail
          umask 077
          host="${SIUE_USER%@*}@www.cs.siue.edu"
          passfile="$RUNNER_TEMP/siue.pass"
          printf '%s\n' "$SIUE_PASSWORD" >"$passfile"
          trap 'rm -f "$passfile"' EXIT
          # One login: deploy.sh reads the host's stamp back on the same
          # connection and fails unless it holds this commit's content.
          make -C websites/www.cs deploy HOST="$host" SSHPASS_FILE="$passfile" PRUNE=1 FORCE="$FORCE"

      - name: Check the live site
        if: steps.tip.outputs.skip != '1'
        run: |
          set -euo pipefail
          # Each game's page and each server endpoint a player depends on: a
          # broken endpoint fails the deploy instead of failing players.
          for path in "" play/tankity/ play/crete/ play/cylon/ games/tankity/ \
              games/tankity/rooms.php?action=ping games/tankity/scores.php games/cylon/scores.php; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://www.cs.siue.edu/~wgrim/$path")
            echo "$code /~wgrim/$path"
            [ "$code" = 200 ]
          done

  bank:
    # The same gate as the site's deploy: a green ci run from a push to main, or by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: deploy-crete-bank
      cancel-in-progress: false
    env:
      BANK_HOST: happystl@iad1-shared-b7-41.dreamhost.com
      BANK_URL: https://www.happystl.com/crete-bank/endless-bank.php
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Check this is main's tip
        id: tip
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tip=$(git rev-parse HEAD)
          if [ -n "$RUN_SHA" ] && [ "$RUN_SHA" != "$tip" ]; then
            echo "ci passed for $RUN_SHA, but main is now $tip; its own run deploys it"
            echo "skip=1" >>"$GITHUB_OUTPUT"
          else
            echo "deploying the bank from $tip"
          fi

      # deploy-bank.sh checks every PHP file parses and writes bank/place.json with PHP.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        if: steps.tip.outputs.skip != '1'
        with:
          php-version: "8.4"
          coverage: none

      - name: Install the host keys
        if: steps.tip.outputs.skip != '1'
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          grep -v '^#' .github/ssh_known_hosts >~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Load the deploy key and the bank's token
        if: steps.tip.outputs.skip != '1'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DREAMHOST_KEY: op://khvwk3iogv3mhhjui4se7xqyni/Dreamhost Deploys/private key?ssh-format=openssh
          CRETE_BANK_VERIFIER_TOKEN: op://khvwk3iogv3mhhjui4se7xqyni/Crete Config/bank-verifier

      - name: Deploy the bank
        if: steps.tip.outputs.skip != '1'
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/dreamhost.key"
          printf '%s\n' "$DREAMHOST_KEY" >"$key"
          trap 'rm -f "$key"' EXIT
          HOST="$BANK_HOST" SSH_KEY="$key" websites/www.cs/games/crete/tools/deploy-bank.sh

      - name: Check the live bank
        if: steps.tip.outputs.skip != '1'
        run: |
          set -euo pipefail
          umask 077
          # It answers, signs a CSRF token, lets Endless's pages on www.cs.siue.edu call it, and keeps its levels in
          # the folder the deploy named (trusted-where, read only).
          body="$RUNNER_TEMP/bank.json"
          code=$(curl -s -o "$body" -w '%{http_code}' --max-time 20 "$BANK_URL")
          echo "$code $BANK_URL"
          [ "$code" = 200 ]
          jq -e '.csrf | test("^[a-f0-9]{32}$")' "$body" >/dev/null
          allow=$(curl -s -o /dev/null -D - --max-time 20 -X OPTIONS -H 'Origin: https://www.cs.siue.edu' \
            -H 'Access-Control-Request-Method: POST' "$BANK_URL" | tr -d '\r' | awk -F': ' 'tolower($1) == "access-control-allow-origin" { print $2 }')
          echo "Access-Control-Allow-Origin: $allow"
          [ "$allow" = https://www.cs.siue.edu ]
          headers="$RUNNER_TEMP/bank.headers"
          printf 'Content-Type: application/json\nX-Crete-Verifier: %s\n' "$CRETE_BANK_VERIFIER_TOKEN" >"$headers"
          trap 'rm -f "$headers"' EXIT
          curl -s -o "$body" --max-time 20 -X POST -H @"$headers" -d '{"op":"trusted-where"}' "$BANK_URL"
          jq -r '"the bank'"'"'s folder: \(.kind) \(.dir)" + (if .refused then "; refused: \(.refused)" else "" end)' "$body"
          jq -e '.kind == "host"' "$body" >/dev/null

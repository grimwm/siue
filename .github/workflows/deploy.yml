name: deploy

# Deploys www.cs to www.cs.siue.edu once ci.yml passes on a push to main,
# with the same `make deploy` a person runs. deploy.sh hashes what the site
# serves and compares it with the host's .deploy-hash stamp: nothing to do
# when they match, otherwise it uploads only the files that changed and
# deletes the ones the last deploy sent that are now gone (PRUNE=1). Run it
# by hand from the Actions tab to redeploy main; "force" sends every file.
#
# The deploy job runs in the `production` environment, which only admits
# runs from main. Its one GitHub secret is that environment's
#   OP_SERVICE_ACCOUNT_TOKEN - a 1Password service account, read-only on the
#     vault below.
# The login itself is the SIUE item in the SIUE 1Password vault, referenced
# by id so renaming either never breaks the deploy:
#   vault khvwk3iogv3mhhjui4se7xqyni, item ioa6izbxvctbalcb65y5fr3esu
# The studios' named people and caps are optional, in their own item so a
# missing one cannot stop the login loading:
#   item "SIUE music studio config" in the same vault, field studio-config,
#   JSON (see websites/www.cs/admin/README.md). deploy.sh validates it and
#   writes it to admin/config/studio.json on the host; without the item the
#   site runs on the defaults.
#     username - the SIUE address (wgrim@siue.edu); the host account is the
#                part before the @
#     password - its password, fed to sftp/scp through sshpass
#
# The bank job deploys Crete's shared Endless bank to happystl.com (DreamHost)
# alongside, through games/crete/tools/deploy-bank.sh: the bank's files into
# ~/happystl.com/crete-bank/ (https://www.happystl.com/crete-bank/endless-bank.php),
# its levels kept in ~/crete-bank-data/, outside the web root, which no deploy
# uploads to or deletes. It sends only the bank's files and deletes nothing.
# Same gate, same environment, same 1Password service account, two items:
#   item "Dreamhost Deploys" in the same vault, its private key (an ssh key
#     whose public half is in the account's authorized_keys with `restrict`)
#   item "Crete Config", field bank-verifier: the trusted runner's token
#     (crete-verify.yml reads the same item); deploy-bank.sh stages only its
#     sha256, as bank/verifier.json
#
# The deploy-games job does the same for the games on happystl.com, with
# games/tools/deploy-games.sh and the same `make deploy-games` a person
# runs: the three games under happystl.com/games/. Visitor statistics live
# in the WordPress plugin; the games' beacon posts to its REST endpoint,
# which the live check below verifies alongside the games.
# It runs on the same gate as deploy (a green ci run on main, or by hand).
# It logs into DreamHost the way the bank job does: the same 1Password
# service account, the same "Dreamhost Deploys" item, the host keys in
# .github/ssh_known_hosts, no new secret.
#
# The transfer-game-data job is dispatch only: a one-time migration of the
# live stats history and the game scores from the SIUE server to DreamHost.
# The stats history is fetched and validated on the runner, then loaded into
# the WordPress tables by tools/migrate-stats.php (run over ssh on the
# DreamHost host); the stats database is never copied to DreamHost as a
# file. The CIC board and Tankity's database still go to the games' data
# dirs, as before. It never retries: a failed transfer stops and is re-run
# by hand. After the migration runs once, delete this whole job.
# ssh only accepts the host keys in .github/ssh_known_hosts.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Send every file, even when the host is up to date"
        type: boolean
        default: false
      migrate_force:
        description: "Pass --force to migrate-stats.php: truncate the eight WordPress stats tables and load fresh. Use only when the run refuses because the tables already hold a few new beacon rows."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    # Only a green ci run from a push to this repository's main; a fork's
    # pull request from a branch named main must never get here.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-www-cs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      # Runs finish out of order; deploying an older commit after a newer one
      # would roll the site back. Only main's current tip ships.
      - name: Check this is main's tip
        id: tip
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tip=$(git rev-parse HEAD)
          if [ -n "$RUN_SHA" ] && [ "$RUN_SHA" != "$tip" ]; then
            echo "ci passed for $RUN_SHA, but main is now $tip; its own run deploys it"
            echo "skip=1" >>"$GITHUB_OUTPUT"
          else
            echo "deploying $tip"
          fi

      # deploy.sh checks generated pages with PHP, Tankity's compiled modules
      # with Node, and hashes with python3.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        if: steps.tip.outputs.skip != '1'
        with:
          php-version: "8.4"
          coverage: none

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.tip.outputs.skip != '1'
        with:
          node-version: "24"

      - name: Install sshpass and the host keys
        if: steps.tip.outputs.skip != '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 700 ~/.ssh
          grep -v '^#' .github/ssh_known_hosts >~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf 'Host www.cs.siue.edu\n  StrictHostKeyChecking yes\n' >~/.ssh/config

      - name: Load the deploy login
        if: steps.tip.outputs.skip != '1'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SIUE_USER: op://khvwk3iogv3mhhjui4se7xqyni/ioa6izbxvctbalcb65y5fr3esu/username
          SIUE_PASSWORD: op://khvwk3iogv3mhhjui4se7xqyni/ioa6izbxvctbalcb65y5fr3esu/password

      - name: Load the studio config (optional)
        if: steps.tip.outputs.skip != '1'
        continue-on-error: true
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          STUDIO_CONFIG: op://khvwk3iogv3mhhjui4se7xqyni/SIUE music studio config/studio-config

      - name: Deploy
        if: steps.tip.outputs.skip != '1'
        env:
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          set -euo pipefail
          umask 077
          host="${SIUE_USER%@*}@www.cs.siue.edu"
          passfile="$RUNNER_TEMP/siue.pass"
          printf '%s\n' "$SIUE_PASSWORD" >"$passfile"
          trap 'rm -f "$passfile"' EXIT
          # One login: deploy.sh reads the host's stamp back on the same
          # connection and fails unless it holds this commit's content.
          make -C websites/www.cs deploy HOST="$host" SSHPASS_FILE="$passfile" PRUNE=1 FORCE="$FORCE"

      - name: Check the live site
        if: steps.tip.outputs.skip != '1'
        run: |
          set -euo pipefail
          # Each game's page and each server endpoint a player depends on: a
          # broken endpoint fails the deploy instead of failing players.
          for path in "" play/tankity/ play/crete/ play/cylon/ games/tankity/ \
              games/tankity/rooms.php?action=ping games/tankity/scores.php games/cylon/scores.php; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://www.cs.siue.edu/~wgrim/$path")
            echo "$code /~wgrim/$path"
            [ "$code" = 200 ]
          done

  bank:
    # The same gate as the site's deploy: a green ci run from a push to main, or by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: deploy-crete-bank
      cancel-in-progress: false
    env:
      BANK_HOST: happystl@iad1-shared-b7-41.dreamhost.com
      BANK_URL: https://www.happystl.com/crete-bank/endless-bank.php
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Check this is main's tip
        id: tip
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tip=$(git rev-parse HEAD)
          if [ -n "$RUN_SHA" ] && [ "$RUN_SHA" != "$tip" ]; then
            echo "ci passed for $RUN_SHA, but main is now $tip; its own run deploys it"
            echo "skip=1" >>"$GITHUB_OUTPUT"
          else
            echo "deploying the bank from $tip"
          fi

      # deploy-bank.sh checks every PHP file parses and writes bank/place.json with PHP.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        if: steps.tip.outputs.skip != '1'
        with:
          php-version: "8.4"
          coverage: none

      - name: Install the host keys
        if: steps.tip.outputs.skip != '1'
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          grep -v '^#' .github/ssh_known_hosts >~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Load the deploy key and the bank's token
        if: steps.tip.outputs.skip != '1'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DREAMHOST_KEY: op://khvwk3iogv3mhhjui4se7xqyni/Dreamhost Deploys/private key?ssh-format=openssh
          CRETE_BANK_VERIFIER_TOKEN: op://khvwk3iogv3mhhjui4se7xqyni/Crete Config/bank-verifier

      - name: Deploy the bank
        if: steps.tip.outputs.skip != '1'
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/dreamhost.key"
          printf '%s\n' "$DREAMHOST_KEY" >"$key"
          trap 'rm -f "$key"' EXIT
          HOST="$BANK_HOST" SSH_KEY="$key" websites/www.cs/games/crete/tools/deploy-bank.sh

      - name: Check the live bank
        if: steps.tip.outputs.skip != '1'
        run: |
          set -euo pipefail
          umask 077
          # It answers, signs a CSRF token, lets Endless's pages on www.cs.siue.edu call it, and keeps its levels in
          # the folder the deploy named (trusted-where, read only).
          body="$RUNNER_TEMP/bank.json"
          code=$(curl -s -o "$body" -w '%{http_code}' --max-time 20 "$BANK_URL")
          echo "$code $BANK_URL"
          [ "$code" = 200 ]
          jq -e '.csrf | test("^[a-f0-9]{32}$")' "$body" >/dev/null
          allow=$(curl -s -o /dev/null -D - --max-time 20 -X OPTIONS -H 'Origin: https://www.cs.siue.edu' \
            -H 'Access-Control-Request-Method: POST' "$BANK_URL" | tr -d '\r' | awk -F': ' 'tolower($1) == "access-control-allow-origin" { print $2 }')
          echo "Access-Control-Allow-Origin: $allow"
          [ "$allow" = https://www.cs.siue.edu ]
          headers="$RUNNER_TEMP/bank.headers"
          printf 'Content-Type: application/json\nX-Crete-Verifier: %s\n' "$CRETE_BANK_VERIFIER_TOKEN" >"$headers"
          trap 'rm -f "$headers"' EXIT
          curl -s -o "$body" --max-time 20 -X POST -H @"$headers" -d '{"op":"trusted-where"}' "$BANK_URL"
          jq -r '"the bank'"'"'s folder: \(.kind) \(.dir)" + (if .refused then "; refused: \(.refused)" else "" end)' "$body"
          jq -e '.kind == "host"' "$body" >/dev/null

  deploy-games:
    # The games on happystl.com, on the same gate as deploy: only a green ci
    # run from a push to this repository's main; a fork's pull request from a
    # branch named main must never get here.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-games
      cancel-in-progress: false
    env:
      GAMES_HOST: happystl@iad1-shared-b7-41.dreamhost.com
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      # Runs finish out of order; deploying an older commit after a newer one
      # would roll the games back. Only main's current tip ships.
      - name: Check this is main's tip
        id: tip
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tip=$(git rev-parse HEAD)
          if [ -n "$RUN_SHA" ] && [ "$RUN_SHA" != "$tip" ]; then
            echo "ci passed for $RUN_SHA, but main is now $tip; its own run deploys it"
            echo "skip=1" >>"$GITHUB_OUTPUT"
          else
            echo "deploying $tip"
          fi

      # deploy-games.sh checks the games' install files with PHP, their
      # compiled modules with Node, and hashes with python3.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        if: steps.tip.outputs.skip != '1'
        with:
          php-version: "8.4"
          coverage: none

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.tip.outputs.skip != '1'
        with:
          node-version: "24"

      - name: Install the host keys
        if: steps.tip.outputs.skip != '1'
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          grep -v '^#' .github/ssh_known_hosts >~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Load the deploy key
        if: steps.tip.outputs.skip != '1'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DREAMHOST_KEY: op://khvwk3iogv3mhhjui4se7xqyni/Dreamhost Deploys/private key?ssh-format=openssh

      - name: Deploy the games
        if: steps.tip.outputs.skip != '1'
        env:
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/dreamhost.key"
          printf '%s\n' "$DREAMHOST_KEY" >"$key"
          trap 'rm -f "$key"' EXIT
          # One login: deploy-games.sh reads the host's stamp back on the
          # same connection and fails unless it holds this commit's content.
          HOST="$GAMES_HOST" SSH_KEY="$key" WEB_ROOT="/home/happystl/happystl.com" PRUNE=1 FORCE="$FORCE" ./websites/www.cs/games/tools/deploy-games.sh

      - name: Check the live games
        if: steps.tip.outputs.skip != '1'
        run: |
          set -euo pipefail
          # A GitHub runner's bare curl is rate-limited by Cloudflare bot
          # management (a 429 failed this step once), so every check sends
          # a browser User-Agent and retries transient codes before failing.
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          check() {
            local url=$1 want=$2 code attempt
            shift 2
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -A "$UA" "$@" "$url") || code=000
              echo "$code $url (attempt $attempt)"
              case " $want " in *" $code "*) return 0 ;; esac
              case "$code" in 429|500|502|503|504) sleep 10 ;; *) return 1 ;; esac
            done
            return 1
          }
          # Each game and each server endpoint a player depends on: a broken
          # endpoint fails the deploy instead of failing players.
          for path in "games/tankity/" "games/crete/" "games/cylon/" "games/tankity/scores.php" "games/cylon/scores.php"; do
            check "https://www.happystl.com/$path" "200"
          done
          # The stats beacon's WordPress endpoint answers 204 to a POST and
          # 405 to a GET; either proves the endpoint runs. The POST body is
          # deliberately not a view, so the check counts nothing.
          check "https://www.happystl.com/wp-json/happystl/v1/stats/collect" "405"
          check "https://www.happystl.com/wp-json/happystl/v1/stats/collect" "204" -X POST -H 'Content-Type: text/plain' --data '{}'

  transfer-game-data:
    # Dispatch only: a one-time migration of the live stats history and the
    # game scores from the SIUE server to DreamHost. The stats history moves
    # only this way; it is not seedable over HTTP. The beacon already points
    # at the WordPress endpoint, so fetch and migrate in one window, just
    # after midnight Chicago time: beacons sent between the fetch and the
    # migration land in SIUE's database and are lost. The scores go to the
    # games' data dirs first, so a migration failure never blocks them;
    # the stats database itself is never copied to DreamHost as a file.
    # First dispatch with migrate_force=false; if the run refuses because
    # the WordPress tables already hold a few new beacon rows, re-dispatch
    # with migrate_force=true (it truncates the eight tables and loads
    # fresh — only correct while the new-beacon count is tiny). No retry
    # loop: a failed transfer stops and is re-run by hand. After the
    # migration runs once, delete this whole job.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: transfer-game-data
      cancel-in-progress: false
    env:
      GAMES_HOST: happystl@iad1-shared-b7-41.dreamhost.com
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install sshpass
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Load the SIUE login
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SIUE_USER: op://khvwk3iogv3mhhjui4se7xqyni/ioa6izbxvctbalcb65y5fr3esu/username
          SIUE_PASSWORD: op://khvwk3iogv3mhhjui4se7xqyni/ioa6izbxvctbalcb65y5fr3esu/password

      - name: Load the deploy key
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DREAMHOST_KEY: op://khvwk3iogv3mhhjui4se7xqyni/Dreamhost Deploys/private key?ssh-format=openssh

      - name: Set up ssh
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/dreamhost.key"
          printf '%s\n' "$DREAMHOST_KEY" >"$key"
          chmod 600 "$key"
          install -d -m 700 ~/.ssh
          # One known-hosts file covers both hosts now: the SIUE host and the
          # DreamHost host are both in .github/ssh_known_hosts.
          grep -v '^#' .github/ssh_known_hosts >~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf 'Host www.cs.siue.edu\n  StrictHostKeyChecking yes\nHost iad1-shared-b7-41.dreamhost.com\n  StrictHostKeyChecking yes\n  IdentityFile %s\n' "$key" >~/.ssh/config
          echo "DREAMHOST_KEY_FILE=$key" >>"$GITHUB_ENV"

      - name: Copy the data files
        run: |
          set -euo pipefail
          umask 077
          siue_host="${SIUE_USER%@*}@www.cs.siue.edu"
          passfile="$RUNNER_TEMP/siue.pass"
          printf '%s\n' "$SIUE_PASSWORD" >"$passfile"
          trap 'rm -f "$passfile"' EXIT
          tmp="$RUNNER_TEMP/game-data"
          mkdir -p "$tmp"
          # The DreamHost site root is /home/happystl/happystl.com (the bank
          # job's WEB_ROOT); the SIUE site root is the login's home.
          dh_root="/home/happystl/happystl.com"
          # 0. TEMPORARY diagnostics (Nov 25, 2026): run 45674591650 failed at
          # the first fetch — remote open "/wgrim/admin/data/stats.sqlite":
          # Permission denied. List the modes/owners of the data dirs and
          # their parents BEFORE the fetch, so the log shows whether the
          # file or a parent directory blocks the wgrim sftp login. Each
          # listing is failure-tolerant (|| true): an unreadable dir must
          # print its error, not abort the step. Remove this block once the
          # permissions are understood and fixed.
          {
            echo "ls -lad admin admin/data games/cylon games/cylon/data games/tankity games/tankity/data"
            echo "ls -la admin/data"
            echo "ls -la games/cylon/data"
            echo "ls -la games/tankity/data"
          } >"$tmp/diag.batch"
          echo "== SIUE data dir modes/owners (diagnostic) =="
          sshpass -f "$passfile" sftp -oBatchMode=no -b "$tmp/diag.batch" "$siue_host" || true
          echo "== end diagnostic =="
          # 1. Fetch the three files from SIUE in one sftp session. The -wal
          # files ride with their databases when they exist; a missing one is
          # not an error (the '-' prefix lets that get pass), and step 2
          # proves nothing that existed was left behind. The -shm files hold
          # no durable data and are left.
          {
            echo "get admin/data/stats.sqlite $tmp/stats.sqlite"
            echo "-get admin/data/stats.sqlite-wal $tmp/stats.sqlite-wal"
            echo "get games/cylon/data/scores.json $tmp/scores.json"
            echo "get games/tankity/data/tankity.sqlite $tmp/tankity.sqlite"
            echo "-get games/tankity/data/tankity.sqlite-wal $tmp/tankity.sqlite-wal"
          } >"$tmp/fetch.batch"
          sshpass -f "$passfile" sftp -oBatchMode=no -b "$tmp/fetch.batch" "$siue_host"
          # 2. Prove the fetch is complete: list the three SIUE data dirs and
          # require each -wal file they hold to be in $tmp. (The required
          # files already failed loudly above if they were missing.)
          {
            echo "ls -1 admin/data"
            echo "ls -1 games/cylon/data"
            echo "ls -1 games/tankity/data"
          } >"$tmp/list.batch"
          sshpass -f "$passfile" sftp -oBatchMode=no -b "$tmp/list.batch" "$siue_host" >"$tmp/list.log" 2>&1
          python3 - "$tmp" "$tmp/list.log" <<'PYEOF'
          import os, sys
          tmp, log = sys.argv[1], open(sys.argv[2]).read()
          listed = set(log.split())
          for wal in ("stats.sqlite-wal", "tankity.sqlite-wal"):
              if wal in listed and not os.path.exists(os.path.join(tmp, wal)):
                  raise SystemExit(f"transfer: {wal} exists on SIUE but was not fetched")
          print("fetch complete: every -wal the server holds is in the transfer")
          PYEOF
          # 3. Validate on the runner before anything is sent: both databases
          # must pass integrity_check (the -wal rides along, so a database
          # opened here sees its uncheckpointed writes), and the board must
          # be valid JSON with the week's and all-time lists. This runs on
          # the runner's copies, never the live files.
          python3 - "$tmp" <<'PYEOF'
          import json, sqlite3, sys
          tmp = sys.argv[1]
          for db in ("stats.sqlite", "tankity.sqlite"):
              con = sqlite3.connect(f"{tmp}/{db}")
              row = con.execute("PRAGMA integrity_check").fetchone()
              con.close()
              if not row or row[0] != "ok":
                  raise SystemExit(f"transfer: {db} failed integrity_check: {row}")
          with open(f"{tmp}/scores.json") as f:
              scores = json.load(f)
          if not isinstance(scores, dict) or not isinstance(scores.get("week"), list) or not isinstance(scores.get("alltime"), list):
              raise SystemExit("transfer: scores.json is not a CIC board (week/alltime lists)")
          print("validated: stats.sqlite, tankity.sqlite, scores.json")
          PYEOF
      - name: Checkpoint the stats WAL
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/game-data"
          # migrate-stats.php refuses a non-empty -wal beside the SQLite
          # file: the copy may be missing its latest writes. Checkpointing
          # merges the -wal into stats.sqlite, so the file the migration
          # reads is complete. The -wal itself is never sent to DreamHost.
          python3 - "$tmp" <<'PYEOF'
          import os, sqlite3, sys
          tmp = sys.argv[1]
          con = sqlite3.connect(f"{tmp}/stats.sqlite")
          con.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          con.close()
          wal = f"{tmp}/stats.sqlite-wal"
          if os.path.exists(wal) and os.path.getsize(wal) > 0:
              raise SystemExit("transfer: stats.sqlite-wal is still non-empty after checkpoint")
          print("checkpointed: stats.sqlite holds its latest writes; no -wal ships")
          PYEOF

      - name: Send the scores to DreamHost
        run: |
          set -euo pipefail
          umask 077
          tmp="$RUNNER_TEMP/game-data"
          # The DreamHost site root is /home/happystl/happystl.com (the bank
          # job's WEB_ROOT); the SIUE site root is the login's home.
          dh_root="/home/happystl/happystl.com"
          # The CIC board and Tankity's database go to the games' data dirs,
          # as before. The files are 666, like the CIC board
          # deploy-games.sh creates: PHP runs as a different user from the
          # site account, and must be able to write them in place. The stats
          # database is NOT sent: it is migrated into WordPress below, and
          # there is no SQLite file on DreamHost afterwards. The scores go
          # first, so a migration failure never blocks them, and re-running
          # the job re-puts them idempotently.
          {
            echo "-mkdir $dh_root/games"
            echo "-mkdir $dh_root/games/cylon"
            echo "-mkdir $dh_root/games/cylon/data"
            echo "-mkdir $dh_root/games/tankity"
            echo "-mkdir $dh_root/games/tankity/data"
            echo "put $tmp/scores.json $dh_root/games/cylon/data/scores.json"
            echo "put $tmp/tankity.sqlite $dh_root/games/tankity/data/tankity.sqlite"
            [ -f "$tmp/tankity.sqlite-wal" ] && echo "put $tmp/tankity.sqlite-wal $dh_root/games/tankity/data/tankity.sqlite-wal"
            echo "chmod 666 $dh_root/games/cylon/data/scores.json"
            echo "chmod 666 $dh_root/games/tankity/data/tankity.sqlite"
            echo "ls -l $dh_root/games/cylon/data"
            echo "ls -l $dh_root/games/tankity/data"
          } >"$tmp/put-scores.batch"
          sftp -oBatchMode=no -b "$tmp/put-scores.batch" "$GAMES_HOST"

      - name: Migrate the stats history into WordPress
        env:
          MIGRATE_FORCE: ${{ inputs.migrate_force && '--force' || '' }}
        run: |
          set -euo pipefail
          umask 077
          tmp="$RUNNER_TEMP/game-data"
          migrate_dir="/home/happystl/migrate"
          # The script runs on the DreamHost host, where both the fetched
          # SQLite file and WordPress live. Upload both, run it over ssh,
          # and remove the staging dir afterwards — even on failure, best
          # effort, so a failed run never leaves the history lying around.
          cleanup() {
            ssh -o BatchMode=yes "$GAMES_HOST" "rm -rf '$migrate_dir'" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          {
            echo "-mkdir $migrate_dir"
            echo "put $tmp/stats.sqlite $migrate_dir/stats.sqlite"
            echo "put tools/migrate-stats.php $migrate_dir/migrate-stats.php"
            echo "ls -l $migrate_dir"
          } >"$tmp/put-migrate.batch"
          sftp -oBatchMode=no -b "$tmp/put-migrate.batch" "$GAMES_HOST"
          # Loud pre-flight on the host: ssh must work, and the host must
          # have a PHP CLI at all. (Neither is verifiable from the runner
          # without dispatching; a missing php fails here, before anything
          # is written.)
          ssh -o BatchMode=yes "$GAMES_HOST" 'command -v php && php -v && ls -l /home/happystl/migrate && test -f /home/happystl/happystl.com/wp-load.php'
          # Dry run first: it reports the source counts and what would be
          # copied, and writes nothing. It also refuses, like the real run,
          # when the WordPress tables already hold rows without --force.
          ssh -o BatchMode=yes "$GAMES_HOST" "php '$migrate_dir/migrate-stats.php' --sqlite='$migrate_dir/stats.sqlite' --wp-load=/home/happystl/happystl.com/wp-load.php --dry-run"
          # The real run. Its own output shows the per-table counts and the
          # COUNT(*) verification; a mismatch exits non-zero and fails the job.
          ssh -o BatchMode=yes "$GAMES_HOST" "php '$migrate_dir/migrate-stats.php' --sqlite='$migrate_dir/stats.sqlite' --wp-load=/home/happystl/happystl.com/wp-load.php $MIGRATE_FORCE"
          trap - EXIT
          cleanup
          echo "migration complete: stats history is in the WordPress tables"

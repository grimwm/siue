# Local only (make admin-smoke); CI and the host never read it. Points the admin
# pages at a local base URL and has them write each mail to a file instead of
# sending it. The base URL has no port because nginx's host port is ephemeral:
# the smoke sends Host: localhost to that port and rewrites the mailed link.
services:
  www-cs-php:
    environment:
      ADMIN_BASE_URL: http://localhost/admin/
      ADMIN_MAIL_CAPTURE_DIR: /var/www/html/admin/data/mail

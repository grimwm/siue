server {
    listen 80;
    root /var/www/html;
    index index.html index.php;

    # Parity with games/.htaccess (mod_deflate on the same text types; images
    # and audio stay as they are). A PHP reply that compresses itself
    # (rooms.php) already carries Content-Encoding, which nginx leaves alone.
    gzip on;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml application/manifest+json;

    # The repo holds files the server never receives (docker/, tests/, Makefile,
    # compose.yaml, dotfiles such as games/tankity/.config.yaml).
    location ~ /\.(?!well-known) { deny all; }
    location ^~ /docker/ { deny all; }
    location ^~ /tests/ { deny all; }
    location ~ ^/(Makefile|compose\.yaml)$ { deny all; }
    # nginx ignores .htaccess; mirror games/cylon/data/.htaccess (Require all
    # denied), which keeps scores and config unreadable over HTTP on the host.
    location ^~ /games/cylon/data/ { deny all; }
    # games/tankity/server/ holds libraries for rooms.php; its .htaccess denies them.
    location ^~ /games/tankity/server/ { deny all; }
    # The Blender script behind a game's effect sprites is a dev tool. (The
    # effects editor, games/*/fx-editor.html, stays reachable here: this is the
    # local dev server, and deploy.sh never uploads it.)
    location ~ ^/games/[^/]+/fx/blender/ { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}

<!-- Cylon Defense — FX / overlays injected into #game-root -->
<div class="cylon-scanner" aria-hidden="true">
  <div class="cylon-eye" id="cylon-eye"></div>
</div>
<div class="cylon-glare" id="cylon-glare" aria-hidden="true"></div>

<div class="cylon-ambush-under" id="cylon-ambush-under" aria-hidden="true"></div>
<div class="cylon-battlefield" id="cylon-battlefield" aria-hidden="true"></div>
<div class="cylon-nuke-missile" id="cylon-nuke-missile" aria-hidden="true"></div>
<div class="cylon-small-missile" id="cylon-small-missile" aria-hidden="true"></div>
<div class="cylon-nuke" id="cylon-nuke" aria-hidden="true">
  <div class="cylon-nuke-flash"></div>
  <div class="cylon-nuke-ball"></div>
  <div class="cylon-nuke-ring"></div>
</div>
<div class="cylon-raptor" id="cylon-raptor" aria-hidden="true">
  <div class="cylon-raptor-skyflash"></div>
  <div class="cylon-raptor-ground"></div>
  <div class="cylon-raptor-ship">
    <span class="cylon-raptor-wing cylon-raptor-wing-l"></span>
    <span class="cylon-raptor-fuselage"></span>
    <span class="cylon-raptor-wing cylon-raptor-wing-r"></span>
    <span class="cylon-raptor-engine"></span>
    <span class="cylon-raptor-cannon cylon-raptor-cannon-l"></span>
    <span class="cylon-raptor-cannon cylon-raptor-cannon-r"></span>
    <span class="cylon-raptor-beam cylon-raptor-beam-l"></span>
    <span class="cylon-raptor-beam cylon-raptor-beam-r"></span>
    <span class="cylon-raptor-beam-core"></span>
  </div>
  <div class="cylon-raptor-strafe"></div>
  <div class="cylon-raptor-impacts" id="cylon-raptor-impacts"></div>
</div>

<div class="cylon-reticle" id="cylon-reticle" hidden aria-hidden="true">
  <span class="cylon-reticle-ring"></span>
  <span class="cylon-reticle-core"></span>
</div>

<div class="cylon-intro-title" id="cylon-intro-title" hidden aria-hidden="true">The CIC</div>

<div id="cylon-help-root"></div>

<div class="cylon-gameover" id="cylon-gameover" hidden>
  <div class="cylon-gameover-panel" role="dialog" aria-modal="true" aria-labelledby="cylon-gameover-title">
    <p class="cylon-gameover-kicker">Cylon defense</p>
    <h2 class="cylon-gameover-title" id="cylon-gameover-title">Game Over</h2>
    <p class="cylon-gameover-reason" id="cylon-gameover-reason"></p>
    <p class="cylon-gameover-stats">
      <span><em id="cylon-gameover-kos">0</em> KOs</span>
      <span><em id="cylon-gameover-hits">0</em> HP</span>
    </p>
    <div class="cylon-gameover-entry" id="cylon-gameover-entry">
      <p class="cylon-gameover-entry-label">Enter your initials</p>
      <div class="cylon-initials" id="cylon-initials" role="group" aria-label="Arcade initials">
        <div class="cylon-initial-slot">
          <button type="button" class="cylon-initial-spin" data-initial="0" data-dir="1" aria-label="Scroll initial 1 up">▲</button>
          <button type="button" class="cylon-initial" id="cylon-initial-0" data-initial="0" aria-label="Initial 1, use up and down to change">A</button>
          <button type="button" class="cylon-initial-spin" data-initial="0" data-dir="-1" aria-label="Scroll initial 1 down">▼</button>
        </div>
        <div class="cylon-initial-slot">
          <button type="button" class="cylon-initial-spin" data-initial="1" data-dir="1" aria-label="Scroll initial 2 up">▲</button>
          <button type="button" class="cylon-initial" id="cylon-initial-1" data-initial="1" aria-label="Initial 2, use up and down to change">A</button>
          <button type="button" class="cylon-initial-spin" data-initial="1" data-dir="-1" aria-label="Scroll initial 2 down">▼</button>
        </div>
        <div class="cylon-initial-slot">
          <button type="button" class="cylon-initial-spin" data-initial="2" data-dir="1" aria-label="Scroll initial 3 up">▲</button>
          <button type="button" class="cylon-initial" id="cylon-initial-2" data-initial="2" aria-label="Initial 3, use up and down to change">A</button>
          <button type="button" class="cylon-initial-spin" data-initial="2" data-dir="-1" aria-label="Scroll initial 3 down">▼</button>
        </div>
      </div>
      <p class="cylon-gameover-entry-hint">↑↓ change letter · ←→ next · Enter submit</p>
      <p class="cylon-gameover-entry-error" id="cylon-initials-error" hidden role="alert"></p>
      <div class="cylon-gameover-actions">
        <button type="button" class="cylon-gameover-btn" id="cylon-score-submit">Submit Score</button>
        <button type="button" class="cylon-gameover-btn is-ghost" id="cylon-score-skip">Skip</button>
      </div>
    </div>
    <div class="cylon-gameover-board" id="cylon-gameover-board" hidden>
      <p class="cylon-gameover-entry-label">High scores</p>
      <p class="cylon-gameover-alltime" id="cylon-gameover-alltime" role="status" hidden></p>
      <div class="cylon-hs-tabs" role="tablist" aria-label="High score board">
        <button type="button" class="cylon-hs-tab" role="tab" id="cylon-tab-week" data-board="week" aria-selected="true" aria-controls="cylon-gameover-panel">This week</button>
        <button type="button" class="cylon-hs-tab" role="tab" id="cylon-tab-alltime" data-board="alltime" aria-selected="false" tabindex="-1" aria-controls="cylon-gameover-panel">All time</button>
      </div>
      <div role="tabpanel" id="cylon-gameover-panel" aria-labelledby="cylon-tab-week" tabindex="0">
        <ol class="cylon-high-scores" id="cylon-gameover-scores"></ol>
      </div>
      <p class="cylon-gameover-entry-hint" id="cylon-gameover-reset">Play often — the weekly board resets Sunday at midnight Central</p>
      <button type="button" class="cylon-gameover-btn" id="cylon-play-again">Play Again</button>
    </div>
  </div>
</div>

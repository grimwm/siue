# Operation Tankity server settings.
# The game reads this file once at startup and NEVER writes to it.
# Tankity keeps its database (rooms, scores) in games/tankity/data/ when PHP
# can write there, else in /var/tmp/<username>-tankity/ (README "Storage").
# For each setting, the matching environment variable wins when set and non-empty:
#   max_rooms      <- TANKITY_MAX_ROOMS (match slots: how many started matches
#                     can exist at once; only a Start with two or more humans
#                     takes one, the host alone plays in the browser; a full
#                     server reclaims the stalest eligible room, README
#                     "Room slots")
#   max_lobbies    <- TANKITY_MAX_LOBBIES (lobbies waiting at once, in a pool
#                     of their own; default 100)
#   lobbies_per_address <- TANKITY_LOBBIES_PER_ADDRESS (lobbies one address
#                     hosts at once; default 4)
#   room_live_secs <- TANKITY_ROOM_LIVE_SECS (seconds since the last touch
#                     before a lobby closes; also the shortest idle limit of
#                     a started room and the reclaim floor's minimum)
#   data_dir       <- TANKITY_DATA_DIR (the one directory for everything
#                     Tankity keeps: used exactly as given, created 0700 when
#                     missing, an error when not writable, never a fallback.
#                     Unset: games/tankity/data/, else /var/tmp/<user>-tankity/)
#   journal_mode   <- TANKITY_JOURNAL (wal or delete; otherwise chosen from
#                     the storage directory's filesystem)
#   room_joins_per_hour <- TANKITY_ROOM_JOINS_PER_HOUR (rooms created and
#                     joined, together, per address an hour; default 300)
#   room_hosts_per_address <- TANKITY_ROOM_HOSTS_PER_ADDRESS (started matches
#                     one address can host at once, expired ones not
#                     counted; default 4)
#   pow_bits       <- TANKITY_POW_BITS (the room puzzle's difficulty at rest,
#                     in leading zero bits: a join needs this, a create one
#                     more, load adds up to two; 0 turns it off; default 11,
#                     README "Room slots")
#   pow_surge      <- TANKITY_POW_SURGE (creates from every address in ten
#                     minutes that make the puzzle one bit harder; default 60)
#   addr_key       <- TANKITY_ADDR_KEY (the key for the hash a room stores in
#                     place of an address and signs room puzzles with; unset:
#                     a random key made once and kept in the database)
# Point CONFIG_FILE at another file to load settings from elsewhere.
max_rooms: 50
room_live_secs: 600

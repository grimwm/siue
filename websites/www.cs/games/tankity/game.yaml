        - { shape: sprite, rate: 12, sheet: smoke, life: [0.6, 1], speed: [0, 8], angle: 90, spread: 120, gravity: -10, drag: 1.2, size: [2.8000000000000003, 3.5], sizeEnd: 2, alpha: [0, 0.45, 0], rotJitter: 180, wind: 1, tint: "#9a9a9a" }
    impact:

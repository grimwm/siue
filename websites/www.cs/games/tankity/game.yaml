# Operation Tankity: the one file a maintainer edits.
#
# It holds all of the game's tunable data:
#   arsenal  every shell and every shop trick (prices, ballistics, paint)
#   keys     every keyboard binding
#   audio    optional sound-effect and music files
#   effects  every weapon's muzzle flash, trail and blast (particle emitters)
#
# Nothing reads this file at runtime. Browsers cannot read YAML and the web
# host has no YAML extension, so a generator checks it and writes game.json,
# which src/main.ts (the client) and rooms.php (the room server) both load:
#
#   php tools/game-json.php          check this file, rewrite game.json
#   php tools/game-json.php --check  fail if this file is invalid or
#                                    game.json is stale
#
# Run those from this game's folder (from the site folder, www.cs, the path
# is games/tankity/tools/game-json.php). `make test` and `make deploy` run
# --check, so a stale game.json cannot ship. Commit this file and game.json
# together. Errors name the line, for example
#   game.yaml line 41: arsenal.ammo[1].dmg: must be a whole number from 0 to 500
# Unknown keys are errors too, so a typo cannot silently do nothing.
#
# After the last edit to anything the game serves, also run
#   php tools/install-files.php
# which refreshes the offline cache list in sw.js.
#
# YAML subset the generator understands (it is a small parser, not full YAML):
#   - "key: value" mappings and "- item" lists, indented with spaces only
#     (tabs are rejected); a list of mappings starts each item with "- key:"
#   - one-line [a, b] lists and {a: 1, b: 2} maps
#   - plain, 'single' and "double" quoted text; whole numbers, decimals,
#     true, false, null (or ~ or nothing after the colon)
#   - # comments, on their own line or after a value (preceded by a space)
#   - NOT supported: anchors (&), aliases (*), tags (!), block text (| >),
#     lists or maps that wrap over several lines, several documents (---)
# Quote any text that could be mistaken for something else: colours
# ("#ffe27a", since # starts a comment), key tokens such as "1", "a" or " ".

# --------------------------------------------------------------------------
# arsenal
# --------------------------------------------------------------------------
# Every shell (ammo) and every trick or supply (gear) in the shop. The order
# of the rows is the order players see in the shop, the weapon picker and the
# lobby: the shop shows each `cat` under one heading, so a cat's ammo rows
# must sit together (the check refuses a cat that comes back). The cats are
# weapon families, each ordered small to big: Shells, Splitters, Rollers,
# Nukes, Beams, Tracers, Earth, Fire. rooms.php builds its authoritative sim
# from the same rows, so
# prices, damage and unlock rounds can never disagree between solo and rooms.
# Ids (key) are shared by ammo and gear and must be unique.
#
# Balance: test/balance.test.ts fires every gun through the real sim at a
# standard set of scenarios (src/balance.ts) and holds the rows to these
# rules; `node tools/balance-report.ts` prints the numbers.
#   - NUKE does the most expected damage of any gun, at one target and at three.
#   - No gun outside NUKE's cat lands a best single-target hit (one volley,
#     perfectly aimed: a direct hit, a burrow stopping at a hull) above 70%
#     of NUKE's.
#   - Along a weapon line (a cat, or a `line` within it), each tier costs more
#     per shot (price / pack) than the one before, does more expected damage
#     (where the line does damage) and unlocks no sooner.
#   - Every damage gun's damage per dollar sits within 0.5x to 2x the damage
#     guns' median. Utility guns (tracers, dirt, a pour, riot charges, a slump,
#     a harmless crater or burrow whose only damage is a fall) and napalm's
#     damage over time are judged by their lines instead.
#   - A damage gun 1.5x as strong as another never unlocks before it.
#
# ammo row fields
#   key       id, lowercase letters and digits. `shell` must exist and be free
#             (price 0): every player starts with it and never runs out.
#   name      what the shop, HUD and picker call it (max 40 characters).
#   cat       shop section heading, the weapon's family; rows sharing a cat
#             sit together under one heading.
#   line      optional: the weapon line within its cat, lowercase letters and
#             digits (Shells holds the plain shells and the `trick` shells;
#             Earth has `dirt`, `digger`, `sandhog` and others). The rows of
#             one line are tiers, small to big. Left out, the row is on its
#             cat's own line.
#   dmg       damage dealt at the centre of the blast, in armor points. It
#             falls off with distance (never below 30%); a direct hit doubles
#             it. Whole number, 0 to 500. A row with dmg 0 is harmless: its
#             burst carves its crater (or moves the earth its effect moves)
#             and touches no unit (no damage, no shield spent, nobody
#             credited). A tracer must have dmg 0.
#   radius    blast radius in pixels: the crater size, and damage reaches
#             radius + 14 px. Whole number, 1 to 200 (0 to 200 for a
#             tracer, which has no blast). The earth effects read it as
#             they say below; pour and dig take 1 (they never use it).
#   price     dollars for one pack. 0 to 100000.
#   pack      shells per purchase; 0 means the shop does not sell it (only
#             the free `shell` uses 0). 0 to 99.
#   start     shells of it every player starts a match with, 0 to 9.
#             Optional (0 when left out).
#   minRound  first round the shop sells it. 1 means from the pre-match shop;
#             a later round locks the row ("Unlocks in round N") until then.
#   ai        true lets the drone battery carry it. false keeps it player only.
#   aiRound   first round drones carry it (they get a rack of aiRack from
#             then on). minRound is when the PLAYER can buy it; aiRound is
#             when DRONES start firing it, so a shell can reach players before
#             drones, or the other way round. 99 means never (use with
#             ai: false).
#   aiRack    shells of it each drone loads per round, 1 to 9. Optional
#             (2 when left out); only a row with ai: true takes it.
#   effect    what the shell does in flight:
#               shot       a plain shell, bursts where it lands
#               pellets    fires `pellets` shells at once, fanned by `spread`
#               cluster    flies `fuse` seconds, then splits into `split`
#                          bomblets fanned by `fan`; each deals subDmg with
#                          blast subRadius. With `apex: true` it splits at
#                          the top of its arc instead (the first moment it
#                          stops rising, never before 0.1 s), and takes no
#                          fuse
#               proximity  bursts when within `prox` px of any tank
#               seeker     bends toward the nearest tank, `steer` pixels per
#                          second of sideways push
#               emp        also drains `drain` fuel from every tank it touches
#               roller     flies like a shell, but touching down it does not
#                          burst: it rolls along the ground (downhill gains
#                          speed, uphill loses it, `friction` slows it, wind
#                          does not touch it) and bursts on the first unit it
#                          reaches, at the board's edge, once it comes to rest
#                          in a dip, or after `rollTime` seconds. Hit while
#                          still airborne, it bursts as a direct hit, as a
#                          shell does. A drone hovers above the ground, so a
#                          rolling ball touches it when it passes under it.
#               hop        flies like a shell; each burst (on the ground or
#                          a unit) throws the next warhead on from the burst
#                          point, keeping `hopKeep` of its speed and turned
#                          upward, until `hops` warheads have burst or one
#                          leaves the field. The first bursts with dmg and
#                          radius, each later one with subDmg and subRadius.
#                          A warhead never takes a direct hit on the unit
#                          the burst before it struck.
#               scatter    flies like a shell; its burst throws `split`
#                          bomblets upward in a fixed fan `fan` radians wide
#                          at up to `kick` px/s. Each flies with the wind
#                          and bursts where it lands with subDmg and
#                          subRadius (never as a direct hit on the unit the
#                          parent struck).
#               beam       no flight: a straight ray from the muzzle along
#                          the barrel, `range` x power / 100 px long (longer
#                          on a wider field, as shells fly further), cut
#                          short by the field's side edges or its floor. It
#                          hits every unit whose body it crosses once, for
#                          dmg flat (no falloff, no direct-hit double), and
#                          cuts a channel `radius` wide through the hills
#                          every `radius` px along it. Its gunner is never hit.
#               plasma     no flight: a ring of plasma around the gunner's
#                          body, radius x power / 100 px (never under 20).
#                          Every other unit inside it takes dmg with the
#                          usual falloff (no direct-hit double); the gunner
#                          is spared, and it cuts no crater.
#               tracer     flies like a shell and shows the path it flew and
#                          where it came down (gfx.mark); no blast, no crater,
#                          no damage.
#               dirt       flies like a shell; where it bursts it first deals
#                          dmg as a blast with no crater (when dmg is above
#                          0), then drops a disc of dirt `radius` px round
#                          the burst on the ground: each column rises to the
#                          top of the disc over it. A ground unit left more
#                          than 2 px under the surface is buried: it stays
#                          where it is (risen ground never lifts it mid-
#                          round), cannot drive, and its shells start in the
#                          dirt. Drones hover, so risen ground carries them up.
#               pour       flies like a shell; where it bursts it pours
#                          `volume` px^2 of liquid dirt, which runs down to
#                          the bottom of the dip it landed in and sets there
#                          as a flat pool. It spreads only until it is
#                          `poolMin` px deep: where a pool would be shallower
#                          (on flat ground, a gentle slope) it sets as a
#                          puddle poolMin deep and about volume / poolMin
#                          wide, centred where it landed. Liquid that would
#                          reach either edge of the field spills off it and
#                          is lost (a puddle keeps what it holds short of
#                          the edge).
#               dig        flies like a shell; touching the ground it burrows
#                          on along its heading at 240 px/s for `digLen` px,
#                          cutting a trench `digR` px wide on either side (the
#                          ground is a height map, so a tunnel is a trench
#                          open to the sky). With `warheads`, that many blasts
#                          of subDmg and subRadius burst evenly along the
#                          burrow, the last at its end. A unit's body in the
#                          way stops it there, and any warheads left burst
#                          at that point; a shell that strikes a unit in
#                          flight stops at once. Ground a dig takes away
#                          drops the units on it, for fall damage.
#               riot       no flight: clears earth around its gunner and does
#                          no damage. A crater of radius / 2 over the hull,
#                          then one every 4 px along the barrel out to
#                          `radius` px, growing from radius / 4 to radius x
#                          `fan`. It digs a buried tank out.
#               slump      flies like a shell; where it bursts the ground
#                          within `radius` px slumps: `passes` passes, left to
#                          right, each moving earth from the higher of two
#                          neighbouring columns to the lower wherever they
#                          differ by more than `slope` px. No damage; units on
#                          the slopes drop with the ground, for fall damage.
#               napalm     flies like a shell; where it bursts it pours
#                          `volume` px^2 of burning liquid, which runs down
#                          to the bottom of the dip it landed in and pools
#                          there as liquid dirt would, no thinner than
#                          `poolMin` px (on flat ground, a burning puddle
#                          about volume / poolMin wide; what would reach an
#                          edge of the field spills off it). The ground
#                          itself never changes.
#                          The pool burns `burn` seconds: every `tick`
#                          seconds each unit whose body reaches into its
#                          flames (`flame` px tall over the pool) takes dmg
#                          (a shield eats one tick whole, a bunker halves
#                          each), credited to the gunner as a blast's are.
#                          The volley, and the turn, waits for the last tick.
#                          dmg is per tick, 1 or more; radius takes 1 (it
#                          has no blast).
#   speed     launch speed multiplier (1.0 is normal, 1.3 fast). Every
#             gun that flies must reach 85% of a room's 720 px field at full
#             power and its best angle, so no gun is useful only at maximum
#             power (test/balance.test.ts), unless its row says shortRange.
#   shortRange optional: true marks a gun short-range on purpose, which
#             spares it the reach rule; say why in a comment beside it.
#   preview   optional: the firing-range scenario that shows off what the gun
#             does (the shop's V preview and the weapon picker's). A map of:
#               aim     px past the dummy the demo lands its shell (-200 to
#                       200; negative is short of it). 0 when left out.
#               ground  the range: hills (the default), dip (a dip round the
#                       dummy), bowl (a deep bowl round it, which catches
#                       bomblets), ridge (a steep ridge under it), slope (a
#                       slope down to it from the shooter's side), perch (a
#                       perch high over it for the shooter) or buried (the
#                       hills, the shooter buried under a mound).
#               angle   a launch angle the demo keeps, 5 to 85 (it then
#                       finds only the power).
#               dummy   how far from the shooter the dummy stands, 40 to 300 px.
#             Every gun whose power is indirect (a hop, roller, dig, pour,
#             napalm, scatter, cluster, seeker, proximity, beam,
#             tracer, riot or slump) declares one, and its demo must show that
#             power and stay inside the range's frame (test/preview-scenarios).
#   note      one sentence for the shop and picker (max 120 characters; no
#             en or em dashes).
#   gfx       paint job, see below.
#   Extra fields by effect (required for that effect; any other effect
#   refuses them):
#     pellets: pellets (1 to 12), spread (radians between pellets, 0 to 1)
#     cluster: fuse (seconds, 0.1 to 10), split (2 to 12), fan (radians
#              between neighbouring bomblets, 0 to 1), subDmg, subRadius; apex (true or false, optional:
#              true splits at the top of the arc and leaves fuse out)
#     hop: hops (warheads, 2 to 6), hopKeep (the share of its speed each
#          leap keeps, 0.2 to 0.9), subDmg, subRadius
#     scatter: split (bomblets, 2 to 12), fan (total spread in radians,
#              0.2 to 3), kick (fastest bomblet's speed, px/s, 40 to 400),
#              subDmg, subRadius
#     proximity: prox (pixels)   seeker: steer   emp: drain (fuel)
#     roller: friction (the share of its speed it loses per second, 0.01 to
#             5; 0.6 rolls a fair way), rollTime (most seconds it rolls, 0.5
#             to 10)
#     beam: range (its length at full power, px, 60 to 1200); aimMin
#           (optional, -30 to 10, 10 when left out): the barrel's lowest
#           angle while it is loaded, and 180 - aimMin its highest, so -20
#           lets the barrel dip 20 degrees below level on either side. Any
#           other gun aims 10 to 170, and fires inside its own limits
#     pour: volume (px^2 of liquid dirt, 200 to 20000), poolMin (px, the
#           thinnest it spreads, 1 to 60)
#     dig: digLen (px it burrows, 20 to 400), digR (the trench's half width,
#          3 to 30), warheads (0 to 8); subDmg and subRadius with warheads
#          above 0 (and refused with none)
#     riot: fan (the scoop's widest crater as a share of radius, 0.1 to 1.5)
#     slump: slope (px a column may stand above its neighbour, 0.5 to 6),
#            passes (1 to 60)
#     napalm: volume (px^2 of burning liquid, 200 to 20000), poolMin (px,
#             the thinnest it spreads, 1 to 60), burn (seconds
#             it burns, 0.5 to 10), tick (seconds between burns, 0.1 to 2,
#             no longer than burn), flame (px its flames stand over the
#             pool, 4 to 60: a tank's hull bottom sits 3 px below its
#             ground, a drone's body 16 px above it)
#     plasma, tracer and dirt: none
#
# gfx fields (all colours are quoted "#rgb" or "#rrggbb")
#   shell     the shell's body colour in flight, in the replayed volleys and
#             in the picture icon beside its name.
#   trail     the colour of the line it leaves behind, in flight and in the
#             picture icon.
#   blast     two colours, [outer, inner]. blast[0] is the colour of the spark
#             burst thrown when the shell explodes in a solo game, and the
#             edge of the glowing halo behind the shell in its picture icon;
#             blast[1] is the centre of that icon halo only. The expanding
#             disc drawn over the battlefield is a fixed orange and white for
#             every shell, so neither colour recolours it.
#   painter   how the picture icon draws the shell (battlefield shells are
#             always a dot with a trail):
#               disc   a round dot
#               beam   a flat glowing streak, for fast or piercing shots
#               spark  a dot ringed by six short spokes
#               ball   a ball with a stripe across it (the battlefield ball
#                      spins as it travels)
#               dash   a dashed path ending in a mark, for tracers
#               drill  a body with a pointed, fluted bit, for diggers
#               clod   a lumpy ball shedding crumbs, for dirt
#               flame  a flame licking up off a burning drop, for napalm
#             (pellets and cluster shells draw their own multi-dot icons.)
#   shake     screen shake on an explosion in solo play and the range
#             demos, 0 (none) to 1 (violent). Rooms shake by blast size.
#   linger    seconds the blast disc stays on the battlefield, 0.1 to 3.
#             Optional (0.5).
#   mark      tracers only, and required there: what the tracer leaves.
#               line   its path and landing, drawn for its gunner alone
#                      until that gunner fires again
#               smoke  a smoke trail along its path that everyone sees,
#                      drifting with the wind until the round ends
#
# gear row fields
#   key, name, cat, price, note   as for ammo (gear is always sold: no pack)
#   n         the amount, read by the effect:
#               repair     armor restored, up to max armor
#               fuel       driving fuel added
#               plate      max armor added, and the same armor now
#               shield     hits absorbed
#               extralife  lives added (capped at 5 in play)
#               jammer     rounds drones aim worse at you
#               bunker     rounds every hit on you is halved
#               laststand  1
#               parachute  parachutes added (they stack; see fall below)
#   effect    repair, fuel, plate, shield, extralife, jammer, bunker, laststand,
#             parachute
#   minRound  optional, as for ammo
#   dmg, radius  laststand only: the blast of the wreck when you go down

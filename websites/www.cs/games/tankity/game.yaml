      effect: parachute
      note: Opens on a fall that would cost more than a scratch; one per fall.

  # A unit whose ground a blast carves away drops straight down (no sliding)
  # and loses armor by the drop, measured at rest: nothing for the first
  # freePx pixels, then perPx armor per pixel past them, rounded down. The
  # shooter whose blast took the ground is credited with the damage and any
  # wreck; a unit that digs out its own footing credits nobody. A unit that
  # lands on another hurts the one beneath by the same amount. The bunker
  # halves a fall like any hit; a shield does not stop one.
  #
  # The numbers: a burst digs 0.75 x its radius below where it lands, so a
  # unit sitting in a fresh crater drops about 20 px (Shell: 4 armor), 32 px
  # (Mortar: 10), 39 px (Heavy: 14) or 53 px (NUKE: 21). Those sting without
  # deciding a round. Only a pit dug out over several turns, 210 px or more
  # (hills sit 190 to 415, bedrock at 456), wrecks a full 100-armor tank.
  #
  #   freePx     pixels a unit drops for free (a number, 0 to 460)
  #   perPx      armor lost per pixel past freePx (a number, 0 to 10)
  #   chuteOver  a held parachute opens only when the fall would cost more
  #              than this (a whole number, 0 to 500); at or under it the
  #              unit keeps its parachute and takes the scratch. Scorched
  #              Earth's own default is 5.
  #   aiRound    first round each drone carries one parachute (1 to 99)
  fall: {freePx: 10, perPx: 0.5, chuteOver: 5, aiRound: 3}

# --------------------------------------------------------------------------
# keys
# --------------------------------------------------------------------------
# Every keyboard binding. Each action lists the key tokens that trigger it.
# Contexts are checked in this order: scroll, then shop (only while buying),
# then the held aim keys, fire, and last the global taps. A token may be
# bound to one action per context; the same key can do different things in
# different contexts (ArrowUp is power in aim and moves the row in the shop).
#
# Token syntax
#   - A token is matched against the browser's event.code first (ArrowLeft,
#     KeyA, Digit1, ControlLeft, Space, PageDown), then against
#     event.key (a, A, 1, Enter, " "). A single letter matches either
#     case, so "a" works with Shift or Caps Lock.
#   - "Ctrl+F" needs the Control key held and "Shift+KeyJ" the Shift key; the
#     part after the plus is matched against event.code, then event.key, like
#     any other token. While a modifier is held its tokens are tried first, and
#     they never match without it. Browsers keep many Ctrl+ keys for
#     themselves (Ctrl+D bookmarks, Ctrl+U view source), so prefer Shift+.
#   - The FIRST token of an action names the key on buttons, hints and help
#     text (it is printed as a keycap: arrows show as ← ↑ → ↓, KeyG as G,
#     ControlLeft as Ctrl). Put the one you want shown first;
#     later tokens are silent alternatives.
#   - Quote digits ("1") and a lone space (" "), or YAML reads a number.
#   - Touch-only screens ignore this whole section.
# Driving is Shift plus an arrow, and W, A, S, D and C are bound nowhere:
# the arrows do all the aiming, so the other hand only ever needs Shift,
# Space or Ctrl. Q opens the menu and closes whatever is open.
#   - Never bind Escape (or Esc): Safari and Firefox always leave full screen
#     on it, whatever the page does, so the game never asks for it. The
#     check refuses it.
# Only the actions below exist; each must have at least one token.
keys:
  aim:
    barrelLeft: [ArrowLeft, Left]
    barrelRight: [ArrowRight, Right]
    powerUp: [ArrowUp, Up]
    powerDown: [ArrowDown, Down]
    driveLeft: [Shift+ArrowLeft, Shift+Left]
    driveRight: [Shift+ArrowRight, Shift+Right]
  shop:
    selUp: [ArrowUp, Up]
    selDown: [ArrowDown, Down]
    qtyUp: [ArrowRight, Right]
    qtyDown: [ArrowLeft, Left]
    buyRow: ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
    buy: [b, Enter]
    preview: [v, p]
    close: [q]
    next: [n]
  global:
    music: [m]
    nextTrack: [BracketRight, "]"]
    sound: [e]
    log: [l]
    help: [h]
    report: [r]
    random: [t]
    rooms: [o]
    new: [n]
    guns: [g]
    gunStock: [i]
    tutorial: [u]
    battlePreview: [v]
    fullscreen: [f]
    fire: [Space, " ", ControlLeft, ControlRight, Control]
    back: [q]
  scroll:
    lineDown: [j]
    lineUp: [k]
    pageDown: [PageDown]
    pageUp: [PageUp]
    # Shift, not Ctrl: browsers keep Ctrl+D, Ctrl+U, Ctrl+F and Ctrl+B.
    halfDown: [Shift+KeyJ]
    halfUp: [Shift+KeyK]

# --------------------------------------------------------------------------
# audio
# --------------------------------------------------------------------------
# Optional sound files. The game works with none of them: every sound effect
# has a built-in synthesized voice, and the music has built-in synthesized
# songs. A file that is listed but missing, blocked or undecodable is simply
# skipped and the built-in sound plays. Nothing is downloaded until the
# player's first tap or key press, and sound effects are not fetched while
# the Sound toggle is off, nor music while the Music toggle is off.
#
# Paths are relative to this folder (games/tankity/), must stay inside it
# and end in .mp3, .ogg, .m4a or .wav. Use mp3 for the widest browser
# support. Keep sound effects tiny (a few KB; they are decoded in memory) and
# stream-sized music at about 80 kbps. The generator checks that each file
# exists. Where each file came from, its author and its licence are recorded
# in audio/CREDITS.md; add a line there for every file you add, and only add
# files that are CC0 or otherwise free to redistribute.
#
# sfx: one entry per event. An event with no file (or left out) keeps its
# synthesized sound. Events and when they play:
#   move     tank tread clatter while driving  click    menu and shop taps
#   launch   a shell leaves the barrel         boom     any explosion
#   clank    a shell hits a tank's armour      thud     a tank lands; a refused tap
#   warn     an error or refused action        cash     a purchase
#   bark     a drone's radio chirp             win      a round is won
#   lose     a life is lost                    fanfare  the match ends in glory
#   file     path to the sound.
#   volume   0 (silent) to 1 (full), default 1.
# Effects are always played through the Sound toggle (E). The effect files
# are built by audio/sfx/build_sfx.sh (one shared "gritty 16-bit artillery"
# chain over CC0 sources); every file peaks at -2 dBFS, so `volume` is the mix.
#
# music: the soundtrack. The FIRST track is the theme: the demo and intro
# always play it. Each round then picks the next of the other tracks, and a
# track loops for as long as its round lasts: leading and trailing silence
# is trimmed and every pass cross-fades into the next, so any track loops
# without a seam (the files are played as they are). Next track (]) steps
# through the whole list. Each track:
#   file     path to the track (required).
#   title    shown in the log when the track starts (required, max 60).
#   volume   0 to 1, default 1.
#   credit   optional author line shown beside the title (max 120).
# With an empty list, or when no track can play, the built-in songs play and
# follow the round as before. The Music toggle (M) pauses and resumes it.
audio:
  sfx:
    move: {file: audio/sfx/move.mp3, volume: 0.25}
    click: {file: audio/sfx/click.mp3, volume: 0.4}
    launch: {file: audio/sfx/launch.mp3, volume: 0.6}
    boom: {file: audio/sfx/boom.mp3, volume: 0.75}
    clank: {file: audio/sfx/clank.mp3, volume: 0.6}
    thud: {file: audio/sfx/thud.mp3, volume: 0.6}
    warn: {file: audio/sfx/warn.mp3, volume: 0.45}
    cash: {file: audio/sfx/cash.mp3, volume: 0.5}
    bark: {file: audio/sfx/bark.mp3, volume: 0.4}
    win: {file: audio/sfx/win.mp3, volume: 0.55}
    lose: {file: audio/sfx/lose.mp3, volume: 0.55}
    fanfare: {file: audio/sfx/fanfare.mp3, volume: 0.6}
  music:
    - file: audio/music/battle-theme-a.mp3
      title: Battle Theme A
      volume: 0.6
      credit: cynicmusic, CC0
    - file: audio/music/chiptune-level-1.mp3
      title: Action Chiptune 1
      volume: 0.6
      credit: Juhani Junkala, CC0
    - file: audio/music/awake-megawall-10.mp3
      title: "Awake! (Megawall-10)"
      volume: 0.6
      credit: cynicmusic, CC0
    - file: audio/music/chiptune-level-3.mp3
      title: Action Chiptune 3
      volume: 0.6
      credit: Juhani Junkala, CC0

# --------------------------------------------------------------------------
# effects
# --------------------------------------------------------------------------
# What every weapon looks like in flight: the muzzle flash, the trail, the
# blast and a few extras, drawn by the particle engine in src/fx/engine.ts. Looks never
# change the sim. The blast radius, damage and screen shake default come from
# the arsenal above; effects only decorate them, scaling to the radius the
# sim hands them (`unit: r`). The effects editor (fx-editor.html, local site
# only) edits this section live and exports it, ready to paste over the
# `effects:` block at the end of this file (see README.md).
#
# This section is last on purpose: everything from the `effects:` line to the
# end of the file is exactly what the editor writes, so it can be replaced
# whole. Keep it free of comments, and keep each emitter on one line (the
# parser reads flow maps only when they fit on one line).
#
# One entry per ammo key in the arsenal, plus `laststand`, the wreck blast of
# the gear of that name. A missing entry is an error. Each entry:
#   body      the shell itself, optional (the defaults in brackets):
#               halo     glow radius in pixels [9], 0 to 100
#               alpha    glow strength [0.5], 0 to 1
#               pulse    glow flicker, in Hz [0], 0 to 30
#               stretch  pixels of light trailing the shell [0], 0 to 200
#               sprite   the rendered shell: a p_* sheet from
#                        fx/sprites/sprites.json, modelled nose to the right
#                        and turned to the shell's heading. Without it (or
#                        until it loads) the shell is a plain coloured disc.
#               size     the sprite's frame, pixels across [12], 1 to 100
#               fps      frames per second (its spin, flicker or flame) [0],
#                        0 to 60
#               spin     turn the sprite this many degrees a second instead
#                        of along the heading [0], -3600 to 3600
#               roll     a ball's radius in pixels: the frame follows the
#                        distance rolled and the heading is ignored [0], 0 to 50
#   muzzle    an effect, fired once as the shell leaves the barrel;
#             "forward" below is the aim direction
#   trail     an effect, fed every frame while the shell flies; its emitters
#             need a `rate` and drip along the path flown
#   impact    an effect, fired on detonation, centred on the blast
#   special   optional named extras, each an effect:
#               split    cluster: where the shell blooms into bomblets
#               steer    seeker: while it bends toward a tank (rate emitters)
#               pierce   lance: at the tank it passes through
#               arc      EMP: over each tank it fries
#
# effect fields
#   emitters  list of emitters, one per line: `- { shape: ring, ... }`. A
#             muzzle, trail or impact needs at least one. They are drawn in
#             list order.
#   screen    optional { shake, flash }:
#               shake  screen shake, 0 to 1. Leave it out to use the weapon's
#                      gfx.shake from the arsenal.
#               flash  { color, alpha, dur }: a full-screen flash of that
#                      "#rrggbb" colour at alpha 0 to 1 that fades over dur
#                      seconds (0.05 to 1.5). The engine ramps it in over
#                      80 ms and never draws it past 0.35. Players who prefer
#                      reduced motion, or turn Screen flashes off in Settings,
#                      get no flash; Screen flashes off also leaves out the
#                      large bright layers (additive dots, blobs and sprites
#                      sized by the blast radius, three quarters of it or more).
#
# emitter fields. Write only what differs from the default in brackets (the
# editor never writes a default). `count` and `rate` say how much, the rest
# how each particle looks and moves. Ranges are checked.
#   shape     what is drawn [dot]:
#               dot     a round or square point (with glow, a soft blob)
#               streak  a line trailing behind its velocity
#               ring    an expanding outline
#               spark   a four-point star
#               smoke   a soft blob
#               sprite  a frame of a rendered sheet (see sheet)
#               bolt    jagged lightning, along the aim
#               beam    a straight glowing line along the aim
#   count     particles in a burst [0], whole number 0 to 200. Muzzle, impact
#             and specials fire this once; a trail ignores it.
#   rate      particles per second [0], 0 to 500. A trail (and steer) needs it
#             above 0 and drips along the path flown; elsewhere it needs a
#             duration too and streams from the point.
#   delay     seconds before the emitter starts [0], 0 to 5
#   ground    true: an impact emitter that plays only when the blast reached
#             the ground (dirt thrown up, burn marks), not for a burst in
#             the air [false]
#   duration  seconds a rate emitter keeps streaming [0], 0 to 10
#   life      [min, max] seconds a particle lives [[0.4, 0.7]], 0.02 to 10
#   speed     [min, max] pixels per second at birth [[0, 0]], -2000 to 2000
#             (with unit r: multiples of the blast radius per second, -50
#             to 50). Negative with edge flies inward.
#   aim       direction the particle leaves [fixed]: fixed (absolute),
#             forward, back or normal (relative to the shell's heading)
#   angle     degrees counter-clockwise added to the aim [0], -360 to 360
#             (fixed: 0 is right, 90 is up)
#   spread    cone width in degrees [360, every way], 0 to 360
#   offset    spawn within this distance of the point [0], pixels 0 to 500
#             (unit r: multiples of the radius, 0 to 5)
#   edge      true: spawn exactly on the offset circle [false]
#   gravity   pixels per second squared, downward [0]; negative rises. -3000
#             to 3000
#   drag      slowdown per second [0], 0 to 20
#   wind      how far the battlefield wind pushes it [0], 0 to 1
#   size      [min, max] at birth [[2, 3]]: the radius (ring: starting
#             radius; spark: arm length; beam: half width), pixels 0 to 200
#             (unit r: multiples of the radius, 0 to 10)
#   sizeEnd   size multiplier at death [1], 0 to 20
#   ease      how the size changes [linear]: linear, out or in
#   alpha     opacity keyframes [[1, 0]], 1 to 10 numbers 0 to 1, spread
#             evenly over the particle's life
#   colors    colour ramp [["#ffffff"]], 1 to 10 quoted "#rgb" or "#rrggbb"
#             colours, spread evenly over the particle's life
#   glow      true: additive, light-adding drawing [false]
#   round     dots only: false draws square pixels [true]
#   length    streak, beam and bolt length [8], pixels 0 to 1000 (unit r:
#             multiples of the radius, 0 to 10)
#   width     ring line width in pixels [2], 0.1 to 50
#   unit      [px] or r. With r, size, speed, offset and length are
#             multiples of the blast radius, so keep them small (a dot of
#             size 1 is a disc as wide as the blast).
#   rotJitter random start rotation, plus or minus degrees [0], 0 to 360
#   spin      [min, max] degrees per second [[0, 0]], -3600 to 3600
#   sprite emitters only:
#     sheet   a sheet from fx/sprites/sprites.json (required; the file must
#             exist): blast (fireball cooling to smoke), fireball, plume
#             (lingering smoke, tint it), smoke, dirt (ground thrown up;
#             anchor bottom), debris (a tumbling chunk; tint it), scorch
#             (a burn mark), flakburst (an airburst), shock, energy,
#             electric (lightning ball), flare (a hot streak flash), muzzle
#             (a muzzle blast pointing along its rotation), nuke (the
#             mushroom sequence; anchor bottom)
#     fps     frames per second; 0 plays the sheet once over the life [0],
#             0 to 120
#     anim    once (stop on the last frame), loop, or random (loop from a
#             random frame, so a handful of debris all differ) [once]
#     align   true: turn the sprite to the direction it was launched (a
#             muzzle blast with aim forward) [false]
#     scale   extra size multiplier; the sprite spans 2 x size x scale [1],
#             0.05 to 10
#     anchor  center, or bottom to stand the sprite on the point [center]
#     tint    "#rrggbb": multiply the sheet by this colour
#
# Errors name the line and the field, for example
#   game.yaml line 612: effects.mortar.impact.emitters[4].count: must be a whole number from 0 to 200

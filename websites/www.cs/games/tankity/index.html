<!DOCTYPE html>
<html lang="en" data-theme="orange">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operation Tankity: Scorched-Earth Artillery</title>
<!-- app-tags:begin (tools/install-files.php writes this block) -->
<meta name="theme-color" content="#05060f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-apple-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tankity">
<script>window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installPrompt = e; });</script>
<script>if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {}); });</script>
<!-- app-tags:end -->
<!-- The colour theme (src/theme.ts): data-theme above is the default (Orange); the saved choice, or the saved Custom palette, replaces it before the first paint. -->
<script>try { var t = localStorage.getItem('tankity-theme'), c = localStorage.getItem('tankity-theme-custom-palette'); if (/^(yellow|lime|cyan|orange|magenta)$/.test(t)) document.documentElement.setAttribute('data-theme', t); else if (t === 'custom' && /^(--[a-z-]+:[#0-9a-f, ]+;)+$/.test(c)) { document.documentElement.style.cssText += c; document.documentElement.setAttribute('data-theme', t); } } catch (e) { /* the default stays */ }</script>
<link rel="stylesheet" href="game.css?v=94b0b30c19">
</head>
<body>
<header class="topbar">
  <div>
    <h1>Operation Tankity</h1>
    <p class="tagline">Tankity tank rolls out. Mind the wind and flatten the drone battery.</p>
  </div>
</header>

<main class="layout">
  <section class="stage-wrap" id="frame" aria-label="Battlefield">
    <div class="canvas-holder">
      <div class="hudbar-slot" id="hud-bar" data-ui></div>
      <div class="field" id="field">
        <canvas id="stage" width="1080" height="690" role="img"
          aria-label="Hillside artillery battlefield. Your tank, the drone battery, wind and turn order are announced in the log and the status bar."></canvas>
        <div id="title-root" data-ui></div>
        <div id="rotate-hint-root" data-ui></div>
        <div id="round-banner" class="banner" hidden><span id="round-banner-text"></span></div>
        <div id="dialogue" class="dialogue" hidden>
          <canvas id="portrait" width="36" height="36" aria-hidden="true"></canvas>
          <div class="dlg-text"><span id="dlg-name"></span><span id="dlg-line" aria-live="polite"></span></div>
        </div>
        <div id="track-toast" class="track-toast" role="status" aria-live="polite" hidden></div>
        <button type="button" id="btn-speed" class="speed-btn" aria-label="Game speed 1×. Tap for 2×." title="Game speed 1×. Tap for 2×." hidden><span class="ic" aria-hidden="true">▶▶</span><span id="speed-val" class="v" aria-hidden="true">1×</span><kbd class="key" data-keyhint="global:speed" aria-hidden="true">X</kbd></button>
        <span id="speed-live" class="sr-only" role="status" aria-live="polite"></span>
      </div>
      <div class="deck" id="deck" role="group" aria-label="Controls">
        <div class="grp grp-aim" role="group" aria-labelledby="deck-aim-h">
          <span class="gl" id="deck-aim-h">Aim</span>
          <div class="aim-pad">
            <span></span>
            <button type="button" class="btn gold" data-aim="up" aria-label="power up"><span class="ic" aria-hidden="true">▲</span><span class="w">power</span><kbd class="key" data-keyhint="aim:powerUp" aria-hidden="true">↑</kbd></button>
            <span></span>
            <button type="button" class="btn gold" data-aim="left" aria-label="barrel left"><span class="ic" aria-hidden="true">◀</span><span class="w">barrel</span><kbd class="key" data-keyhint="aim:barrelLeft" aria-hidden="true">←</kbd></button>
            <button type="button" class="btn gold" data-aim="down" aria-label="power down"><span class="ic" aria-hidden="true">▼</span><span class="w">power</span><kbd class="key" data-keyhint="aim:powerDown" aria-hidden="true">↓</kbd></button>
            <button type="button" class="btn gold" data-aim="right" aria-label="barrel right"><span class="ic" aria-hidden="true">▶</span><span class="w">barrel</span><kbd class="key" data-keyhint="aim:barrelRight" aria-hidden="true">→</kbd></button>
          </div>
        </div>
        <div class="grp grp-drive" role="group" aria-labelledby="deck-drive-h">
          <span class="gl" id="deck-drive-h">Drive (uses fuel)</span>
          <div class="row">
            <button type="button" id="btn-drive-l" class="btn" style="--c: #7ddf64" aria-label="Drive left"><span class="ic" aria-hidden="true">⇠</span><span class="w"><span class="w-wide">Left</span><span class="w-narrow">Drive</span></span><kbd class="key" data-keyhint="aim:driveLeft" aria-hidden="true">Shift+←</kbd></button>
            <button type="button" id="btn-drive-r" class="btn" style="--c: #7ddf64" aria-label="Drive right"><span class="ic" aria-hidden="true">⇢</span><span class="w"><span class="w-wide">Right</span><span class="w-narrow">Drive</span></span><kbd class="key" data-keyhint="aim:driveRight" aria-hidden="true">Shift+→</kbd></button>
          </div>
        </div>
        <div class="grp grp-more" role="group" aria-labelledby="deck-more-h">
          <span class="gl" id="deck-more-h">More</span>
          <div class="row">
            <button type="button" id="btn-log" class="btn" style="--c: #6fe4ff" aria-expanded="false"><span class="ic" aria-hidden="true">📻</span><span class="w">Radio</span><kbd class="key" data-keyhint="global:log" aria-hidden="true">L</kbd></button>
            <button type="button" id="btn-track" class="btn" style="--c: #ff7ad9"><span class="ic" aria-hidden="true">♫</span><span class="w">Next song</span><kbd class="key" data-keyhint="global:nextTrack" aria-hidden="true">]</kbd></button>
            <button type="button" id="btn-help" class="btn" style="--c: #8f8fff" aria-expanded="false"><span class="ic" aria-hidden="true">?</span><span class="w">Help</span><kbd class="key" data-keyhint="global:help" aria-hidden="true">H</kbd></button>
          </div>
        </div>
        <div class="grp grp-weapon" role="group" aria-labelledby="deck-weapon-h">
          <span class="gl" id="deck-weapon-h">Weapon</span>
          <button type="button" id="btn-weapon" class="btn weap" style="--c: #ffb13c" aria-expanded="false"><span id="deck-gun" class="gun" data-ui></span><kbd class="key" data-keyhint="global:guns" aria-hidden="true">G</kbd></button>
        </div>
        <div class="grp grp-fire">
          <span class="gl" aria-hidden="true">&nbsp;</span>
          <button type="button" id="btn-cannon" class="fire">FIRE<kbd class="key" data-keyhint="global:fire" aria-hidden="true">Space</kbd></button>
        </div>
      </div>
      <section id="log-overlay" class="frame-overlay log-overlay" aria-label="Radio log" data-ui hidden></section>
      <section id="help-overlay" class="frame-overlay card-overlay" aria-labelledby="help-h" data-ui hidden></section>
      <section id="report-overlay" class="frame-overlay card-overlay" aria-labelledby="score-h" data-ui hidden></section>
      <section id="menu-overlay" class="frame-overlay card-overlay menu-card" aria-labelledby="menu-h" data-ui hidden></section>
      <section id="gun-overlay" class="frame-overlay card-overlay gun-card" aria-labelledby="gun-h" data-ui hidden></section>
      <section id="tutorial-overlay" class="coach" aria-label="Tutorial" data-ui hidden></section>
    </div>
    <div id="end-veil" class="veil" data-ui hidden></div>
    <div id="shop-veil" class="veil" data-ui hidden></div>
    <div id="lobby-veil" class="veil" data-ui hidden></div>
    <div id="leave-veil" class="veil" data-ui hidden></div>
    <div id="preview-veil" class="veil" hidden>
      <div class="card" role="dialog" aria-modal="true" aria-labelledby="preview-title">
        <header class="ov-head">
          <div class="ov-title"><p class="kicker">Firing range</p><h2 id="preview-title">Preview</h2></div>
          <button type="button" class="ov-x" id="preview-close" aria-label="Close" title="Close"><span class="key" data-keyhint="global:back">Q</span><span class="x-glyph" aria-hidden="true">×</span></button>
          <div class="nav-hint ov-keys" id="nav-preview" data-scroll-only><span class="scroll-keys"><span data-keyhint="scroll:lineDown">J</span>/<span data-keyhint="scroll:lineUp">K</span> line</span><span class="scroll-keys"><span data-keyhint="scroll:pageUp">PgUp</span>/<span data-keyhint="scroll:pageDown">PgDn</span> page</span><span class="scroll-keys"><span data-keyhint="scroll:halfUp">Shift+K</span>/<span data-keyhint="scroll:halfDown">Shift+J</span> half page</span></div>
        </header>
        <p id="preview-stats" class="runstats"></p>
        <canvas id="preview-stage" width="360" height="200"></canvas>
        <p id="preview-result" class="hint" aria-live="polite"></p>
        <p class="hint">Live demo on a small hill. Same shells, same wind math, same damage numbers.</p>
      </div>
    </div>
    <div id="toast-root" class="toasts" aria-live="polite" data-ui></div>
  </section>
</main>

<script src="dist/fx.js?v=671a8adab3" defer></script>
<script type="module" src="dist/main.js?v=19deabd95d"></script>
<script src="dist/install.js?v=47a830032e" defer></script>
</body>
</html>

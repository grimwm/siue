      <canvas id="stage" width="1080" height="690" role="img"

      <div class="hudbar" id="hud-bar" aria-label="Battle status" data-ui></div>
      <div id="round-banner" class="banner" hidden><span id="round-banner-text"></span></div>

      <div class="pad pad-aim" aria-label="Aiming controls">
        <div class="pad-grid">
          <span></span>
          <button type="button" data-aim="up" aria-label="More power">▲</button>
          <span></span>
          <button type="button" data-aim="left" aria-label="Swing barrel left">◀</button>
          <button type="button" data-aim="down" aria-label="Less power">▼</button>
          <button type="button" data-aim="right" aria-label="Swing barrel right">▶</button>
        </div>

        <button type="button" id="btn-weapon" class="tool" style="--tool: #ffb13c" aria-label="Weapons" data-tip="Weapons" data-tip-desc="Pick any gun on your rack (Q loads the next)" aria-expanded="false"><svg class="tool-icon" viewBox="0 0 26 26" aria-hidden="true"><path d="M2.5 7.5h17.5l1.5-1.5h2v5.5h-5.5l-1 1v1.5" stroke="#ffb13c" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M8 11.5l-1.5 9h4.5l1.5-6" stroke="#9fd8ff" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M12.5 13.5c0 2.5 2 3.5 4 3" stroke="#ffe27a" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 9.5h3" stroke="#ffe27a" stroke-width="1.6" stroke-linecap="round"/></svg><span class="key" data-keyhint="global:guns">(G)</span></button>

        <button type="button" id="btn-track" class="tool" style="--tool: #ff7ad9" aria-label="Next track" data-tip="Next track" data-tip-desc="Change the music to the next song"><svg class="tool-icon" viewBox="0 0 26 26" aria-hidden="true"><path d="M10 18V6l9-2v12" stroke="#ff7ad9" stroke-width="2" fill="none" stroke-linejoin="round"/><circle cx="7.5" cy="18.5" r="2.8" stroke="#ffc2ee" stroke-width="2" fill="none"/><circle cx="16.5" cy="16.5" r="2.8" stroke="#ffc2ee" stroke-width="2" fill="none"/><path d="M20 21l3-2.5-3-2.5" stroke="#ff7ad9" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="key" data-keyhint="global:nextTrack">(])</span></button>

        </header>
        <p id="preview-stats" class="runstats"></p>
        <canvas id="preview-stage" width="360" height="200"></canvas>
        <p id="preview-result" class="hint" aria-live="polite"></p>
        <p class="hint">Live demo on a small hill. Same shells, same wind math, same damage numbers.</p>

    </div>
